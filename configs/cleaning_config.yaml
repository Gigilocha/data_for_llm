# Данный конфиг содержит основные настройки очистки данных.
# ---------------------------------------------------------------------------------------------------------------

# Флаги очистки данных
use_cleaning: true # использовать очистку данных
use_deduplication: true # использовать дедупликацию данных
use_language_filter: true # использовать фильтрацию по языкам
use_semantic_filter: true # использовать семантическую фильтрацию
use_length_filter: true # использовать фильтрацию по длине документа

# Плавующие перменные для фильтрации данных
max_length: 2048 # максимальная длина документа в токенах

# ---------------------------------------------------------------------------------------------------------------

# Настройка очистки данных для pre-training датасетов
pre-training:
  