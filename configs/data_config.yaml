# Настройки загрузки данных для pre-training датасетов
pretrain:
  seed: 42
  shard_size_mb: 1              # ← было 1024 (1 MB вместо 1 GB, чтобы шарды быстро появлялись)
  target_tokens: 10000          # ← было 6000000 (10k токенов, чтобы прогон был секунды)
  val_split_ratio: 0.2          # ← было 0.01 (20% в val, чтобы val точно был непустой)
  split_salt: v1
  overshoot: 1.0                # ← было 2.0 (не нужен запас на тесте)

  languages:
    ru:
      share: 0.6
      profile: prose
      chars_per_token: 3.0
      sources:
        - {name: ru_web,
          kind: hf,
          location: HuggingFaceFW/fineweb-2,
          subset: rus_Cyrl,
          split: "train",     # ← было train (первые 50 строк)
          text_field: text,
          revision: af9c13333eb981300149d5ca60a8e9d659b276b9,
          license: odc-by,
          weight: 0.7,
        }
        - {name: ru_wikipedia,
          kind: hf,
          location: wikimedia/wikipedia,
          subset: 20231101.ru,
          split: "train",     # ← было train
          text_field: text,
          revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa,
          license: cc-by-sa-3.0,
          weight: 0.3
        }

    en:
      share: 0.2
      profile: prose
      chars_per_token: 3.0
      sources:
        - {name: en_web,
          kind: hf,
          location: HuggingFaceFW/fineweb,
          split: "train",     # ← было train
          text_field: text,
          revision: 9bb295ddab0e05d785b879661af7260fed5140fc,
          license: odc-by,
          weight: 1.0
        }

    py:
      share: 0.2
      profile: code
      chars_per_token: 3.0
      sources:
        - {name: python,
          kind: hf,
          location: HuggingFaceCode/stack-v3-train,
          split: "train",     # ← было train (репозитории тяжёлые, 20 хватит)
          text_field: text,
          revision: 1f61b735bc0a5698345ce2196730f24bfa467f33,
          license: odc-by,
          weight: 0.0
        }