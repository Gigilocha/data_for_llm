vocab_size: 2000        # Маленький словарь (обычно 16000-32000)
sample_chars: 50000     # Берем всего 15 000 символов (вместо 2 млн)

special_tokens:
  bos: <|bos|>
  eos: <|eos|>
  pad: <|pad|>
  unk: <|unk|>

split_pattern: "'(?i:[sdmt]|ll|ve|re)|[^\\r\\n\\p{L}\\p{N}]?+\\p{L}+|\\p{N}{1,3}| ?[^\\s\\p{L}\\p{N}]++[\\r\\n]*|\\s*[\\r\\n]|\\s+(?!\\S)|\\s+"