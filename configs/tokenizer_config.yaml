vocab_size: 2000 # Размер словаря
sample_chars: 50000 # Количество символов для подсчета частоты

# Специальные токены
special_tokens:
  bos: <|bos|>
  eos: <|eos|>
  pad: <|pad|>
  unk: <|unk|>

# Паттерн разбиения текста на последовательности
split_pattern: "'(?i:[sdmt]|ll|ve|re)|[^\\r\\n\\p{L}\\p{N}]?+\\p{L}+|\\p{N}{1,3}| ?[^\\s\\p{L}\\p{N}]++[\\r\\n]*|\\s*[\\r\\n]|\\s+(?!\\S)|\\s+"