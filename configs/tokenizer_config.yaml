# Параметры токенизатора
algorithm: bpe  # Алгоритм токенизации (bpe, unigram, wordpiece, etc.)
library: tokenizers # Библиотека токенизации (tokenizers, sentencepiece, etc.)
vocab_size: 16000  # Размер словаря

# Специальные токены
special_tokens:
  bos: <|bos|>
  eos: <|eos|>
  pad: <|pad|>
  user_start: <|user_start|>
  user_end: <|user_end|>
  assistant_start: <|assistant_start|>
  assistant_end: <|assistant_end|>
  tool_call_start: <|tool_call_start|>
  tool_call_end: <|tool_call_end|>
  tool_result_start: <|tool_result_start|>
  tool_result_end: <|tool_result_end|>

# Патерн разделения текста на токены (регулярное выражение)
split_pattern: "'(?i:[sdmt]|ll|ve|re)|[^\\r\\n\\p{L}\\p{N}]?+\\p{L}+|\\p{N}{1,3}| ?[^\\s\\p{L}\\p{N}]++[\\r\\n]*|\\s*[\\r\\n]|\\s+(?!\\S)|\\s+"
