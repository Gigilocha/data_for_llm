[project]
name = "data-for-llm"
version = "0.1.0"
description = "Пайплайн подготовки датасета для обучения LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fasttext-wheel>=0.9.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
