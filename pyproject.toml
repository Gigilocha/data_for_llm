[project]
name = "data-for-llm"
version = "0.1.0"
description = "Пайплайн подготовки датасета для обучения LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fasttext-predict>=0.9.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.25.0",
    "tokenizers>=0.20.0",     
    "transformers>=4.45.0",   
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Добавили scripts, чтобы пайплайн мог делать from scripts.build_cleaned import ...
packages = ["src/common", "src/dataset", "src/tokenizer", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Быстрые тесты (без сети, без чтения реальных файлов)",
    "pipeline: Интеграционные тесты (сборка, очистка, запись)",
]